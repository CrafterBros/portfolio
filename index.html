<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CrafterBros | Minecraft Bedrock Add-on Developer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0f0c;
            color: #f1f1f1;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* NAVBAR */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(11, 15, 12, 0.92);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #252c27;
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            padding: 18px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #7dff91;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: #b7bdb9;
            transition: 0.2s;
        }

        .nav-links a:hover {
            color: #7dff91;
        }

        /* GENERAL */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 80px 25px;
        }

        .section-title {
            font-size: 34px;
            margin-bottom: 30px;
        }

        .section-title span {
            color: #7dff91;
        }

        /* HERO */

        .hero {
            min-height: 80vh;

            display: flex;
            align-items: center;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(67, 255, 100, 0.12),
                    transparent 35%
                );
        }

        .hero-content {
            max-width: 850px;
        }

        .hero-small {
            color: #7dff91;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: clamp(48px, 8vw, 82px);
            line-height: 1;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #7dff91;
        }

        .hero-subtitle {
            font-size: 25px;
            color: #c6ccc8;
            margin-bottom: 25px;
        }

        .hero-description {
            max-width: 700px;
            color: #929993;
            font-size: 18px;
        }

        .buttons {
            margin-top: 30px;

            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            padding: 12px 20px;
            border-radius: 8px;

            border: 1px solid #39433c;

            background: #171d19;

            transition: 0.2s;
        }

        .button:hover {
            border-color: #7dff91;
            transform: translateY(-2px);
        }

        .button.primary {
            background: #7dff91;
            color: #071009;
            border-color: #7dff91;
            font-weight: bold;
        }

        /* ABOUT */

        .about {
            background: #101510;
            border-top: 1px solid #202820;
            border-bottom: 1px solid #202820;
        }

        .about-text {
            max-width: 800px;
            color: #b7beb9;
            font-size: 18px;
        }

        /* PROJECT */

        .project-card {
            background: #111712;
            border: 1px solid #293229;
            border-radius: 14px;
            overflow: hidden;
        }

        .project-header {
            padding: 35px;
            background: #151c16;
        }

        .project-header h3 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .project-header p {
            color: #aeb6b0;
        }

        .project-content {
            padding: 35px;
        }

        .project-description {
            color: #b7beb9;
            font-size: 17px;
            margin-bottom: 35px;
        }

        /* FEATURES */

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .feature {
            padding: 20px;

            background: #171e18;
            border: 1px solid #293229;

            border-radius: 10px;
        }

        .feature h4 {
            color: #7dff91;
            margin-bottom: 8px;
            font-size: 17px;
        }

        .feature p {
            color: #aab1ac;
            font-size: 14px;
        }

        /* VIDEO */

        .video-container {
            margin-top: 35px;

            position: relative;
            width: 100%;
            padding-bottom: 56.25%;

            overflow: hidden;
            border-radius: 12px;
            border: 1px solid #293229;
        }

        .video-container iframe {
            position: absolute;

            width: 100%;
            height: 100%;

            left: 0;
            top: 0;

            border: 0;
        }

        /* SKILLS */

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            padding: 9px 15px;

            border-radius: 20px;

            background: #171e18;
            border: 1px solid #303a31;

            color: #c1c8c3;
        }

        /* OTHER PROJECT */

        .other-project {
            padding: 30px;

            background: #111712;
            border: 1px solid #293229;

            border-radius: 12px;
        }

            color: #7dff91;
            margin-bottom: 10px;
